<script>
    // 1. COLOQUE SUA URL ENTRE AS ASPAS ABAIXO
    const URL_SISTEMA = "SUA_URL_DO_GOOGLE_AQUI";

    const tb_corpo = document.getElementById('f_tabela');
    const campo_data = document.getElementById('f_data');
    if(campo_data) campo_data.value = new Date().toISOString().split('T')[0];

    // 2. FUNÇÃO PARA CARREGAR (NOMES PROTEGIDOS CONTRA TRADUÇÃO)
    async function loadProducts() {
        try {
            const response = await fetch(URL_SISTEMA);
            const data = await response.json();
            
            if (tb_corpo) {
                tb_corpo.innerHTML = "";
                data.forEach(item => {
                    const idSafe = item.normalize('NFD').replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, '_');
                    const row = document.createElement('tr');
                    row.className = "border-b";
                    row.innerHTML = `
                        <td class="p-3 font-bold uppercase text-[10px]">${item}</td>
                        <td class="p-2"><input type="number" name="${idSafe}" class="w-full p-2 border rounded font-black text-center" placeholder="0"></td>
                    `;
                    tb_corpo.appendChild(row);
                });
            }
        } catch (e) {
            if(tb_corpo) tb_corpo.innerHTML = "<tr><td colspan='2' class='p-4 text-red-500 text-center font-bold'>Erro na conexão com a planilha.</td></tr>";
        }
    }

    loadProducts();

    // 3. ENVIO DOS DADOS
    const form_claf = document.getElementById('f_main');
    if(form_claf) {
        form_claf.addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('f_btn');
            const params = new URLSearchParams();
            params.append('nome', document.getElementById('f_nome').value);
            params.append('data', document.getElementById('f_data').value);

            const inputs = this.querySelectorAll('input[type="number"]');
            let filled = false;
            inputs.forEach(i => {
                if(i.value > 0) {
                    params.append(i.name, i.value);
                    filled = true;
                }
            });

            if(!filled) return alert("Por favor, preencha pelo menos uma quantidade.");

            btn.disabled = true;
            btn.innerText = "ENVIANDO...";

            try {
                await fetch(URL_SISTEMA, { method: 'POST', mode: 'no-cors', body: params });
                alert("PEDIDO ENVIADO COM SUCESSO!");
                location.reload();
            } catch (err) {
                alert("Erro ao enviar. Verifique sua internet.");
                btn.disabled = false;
                btn.innerText = "ENVIAR PEDIDO";
            }
        });
    }
</script>
