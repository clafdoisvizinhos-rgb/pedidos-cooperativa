<script>
    // URL do seu Script (Copie a URL da Implantação do Web App)
    const scriptURL = "https://script.google.com/macros/s/AKfycby-8Sx6-7WHVMhUHJ6DDK_GbJpD6b5Zlmx30tR6h5vjeBw2lCmUf3ckKUG6vYf8MjrX/exec";

    document.getElementById('campoData').value = new Date().toISOString().split('T')[0];
    const tbody = document.getElementById('listaProdutos');

    // FUNÇÃO PARA CARREGAR PRODUTOS DA PLANILHA
    async function carregarProdutos() {
        try {
            // Buscamos a lista do Apps Script
            const response = await fetch(scriptURL);
            const produtosPlanilha = await response.json();
            
            tbody.innerHTML = ""; // Limpa antes de carregar

            produtosPlanilha.forEach((prod, index) => {
                const tr = document.createElement('tr');
                tr.className = "item-row border-b border-gray-100";
                
                // Normalização idêntica à que você já usava
                const idPlanilha = prod.normalize('NFD').replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, '_');
                
                tr.innerHTML = `
                    <td class="p-2">
                        <label class="flex items-center gap-2 cursor-pointer select-none">
                            <input type="checkbox" id="check_${index}" class="w-4 h-4 rounded border-gray-300 text-green-600">
                            <span class="text-[11px] font-bold text-gray-800 uppercase tracking-tighter">${prod}</span>
                        </label>
                    </td>
                    <td class="p-1">
                        <input type="number" name="${idPlanilha}" min="0" step="any" inputmode="decimal"
                               class="w-full p-1.5 border border-gray-200 rounded text-center text-sm font-black bg-gray-50 outline-none text-black"
                               placeholder="0"
                               oninput="document.getElementById('check_${index}').checked = (this.value > 0)">
                    </td>
                `;
                tbody.appendChild(tr);
            });
        } catch (err) {
            console.error("Erro ao carregar produtos:", err);
            tbody.innerHTML = "<tr><td colspan='2' class='p-4 text-red-500'>Erro ao carregar lista de produtos.</td></tr>";
        }
    }

    // Chama a função ao abrir a página
    carregarProdutos();
