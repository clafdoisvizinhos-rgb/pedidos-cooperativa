<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cooperativa CLAF - Entrega</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap');
.fonte { font-family:'Courier Prime', monospace; }
</style>
</head>

<body class="bg-gray-100">

<div class="max-w-[380px] mx-auto bg-white shadow min-h-screen">

  <!-- CABEÇALHO -->
  <div class="bg-green-700 text-white text-center p-4">
    <h1 class="text-sm font-bold uppercase">Cooperativa</h1>
    <h2 class="text-4xl font-black text-yellow-400">CLAF</h2>
    <p class="text-[10px] uppercase">Sistema de Entrega</p>
  </div>

  <!-- FORMULÁRIO -->
  <form id="formEntrega" class="p-3 space-y-3 fonte">

    <label class="block text-xs font-bold">PRODUTOR</label>
    <input name="produtor" required
           class="w-full border px-2 py-1 text-sm font-bold">

    <label class="block text-xs font-bold">DATA DA ENTREGA</label>
    <input type="date" name="data" id="dataEntrega" required
           class="w-full border px-2 py-1 text-sm font-bold">

    <table class="w-full border text-sm">
      <thead class="bg-yellow-300">
        <tr>
          <th class="text-left px-2 py-1">PRODUTO</th>
          <th class="w-20 text-center">QTD</th>
        </tr>
      </thead>
      <tbody id="listaProdutos"></tbody>
    </table>

    <button type="submit"
            class="w-full bg-green-600 text-white py-3 font-black uppercase text-sm">
      ENVIAR E SALVAR CUPOM
    </button>

  </form>
</div>

<!-- CUPOM (FORA DA TELA, VISÍVEL AO PDF) -->
<div id="cupom" class="fonte"
     style="position:fixed; left:-9999px; top:0; width:80mm; padding:4mm; background:white">

  <div class="text-center border-b border-dashed mb-2">
    <div class="font-bold">COOPERATIVA CLAF</div>
    <div class="text-[9px]">RECIBO DE ENTREGA</div>
  </div>

  <div class="text-[10px]"><b>PRODUTOR:</b> <span id="cProd"></span></div>
  <div class="text-[10px]"><b>DATA ENTREGA:</b> <span id="cData"></span></div>
  <div class="text-[10px]"><b>REGISTRO:</b> <span id="cHora"></span></div>

  <table class="w-full text-[9px] mt-2">
    <thead>
      <tr>
        <th align="left">PRODUTO</th>
        <th align="right">QTD</th>
      </tr>
    </thead>
    <tbody id="cItens"></tbody>
  </table>

  <div class="border-t border-dashed mt-2 pt-1 text-center text-[8px]">
    CLAF • Sistema de Entrega
  </div>
</div>

<script>
/* ORDEM DEFINITIVA DOS PRODUTOS */
const produtos = [
"ABACATE","ABACAXI","BANANA CATURRA","BANANA MAÇÃ OU PRATA",
"LARANJA BAIANA LIMA","LARANJA COMUM","MAÇÃ","MAMÃO","MANGA",
"MARACUJÁ","MELANCIA","MELÃO","PERA","PÊSSEGO",
"TANGERINA COMUM","TANGERINA PONCÃ",
"ALMEIRÃO","ACELGA","AGRIÃO","ALFACE","COUVE MANTEIGA",
"ESCAROLA","ESPINAFRE","QUIABO","REPOLHO","RÚCULA",
"ABOBRINHA","BETERRABA","BRÓCOLIS","CENOURA","CHUCHU",
"COUVE FLOR","MILHO VERDE","PEPINO","TOMATE","VAGEM",
"PÃO CASEIRO","ALHO PORÓ","CEBOLA","CEBOLINHA","LIMÃO",
"PIMENTÃO","RABANETE","SALSINHA","BATATA DOCE","BATATA INGLESA"
];

const tbody = document.getElementById("listaProdutos");
produtos.forEach(p=>{
  const name = p.normalize("NFD").replace(/[^A-Z0-9]+/g,"_");
  tbody.innerHTML += `
    <tr>
      <td class="px-2 py-1 font-bold">${p}</td>
      <td>
        <input type="number" name="${name}" min="0"
               class="w-full border text-center">
      </td>
    </tr>`;
});

/* DATA AUTOMÁTICA */
const hoje = new Date();
hoje.setMinutes(hoje.getMinutes() - hoje.getTimezoneOffset());
document.getElementById("dataEntrega").value = hoje.toISOString().split("T")[0];

/* SUBMIT */
document.getElementById("formEntrega").addEventListener("submit", async e => {
  e.preventDefault();

  const btn = e.target.querySelector("button");
  btn.disabled = true;
  btn.innerText = "ENVIANDO...";

  const fd = new FormData(e.target);
  const itens = [];

  for (const [k,v] of fd.entries()) {
    if (!["produtor","data"].includes(k) && v > 0) {
      itens.push({ nome:k.replace(/_/g," "), qtd:v });
    }
  }

  if (!itens.length) {
    alert("Informe ao menos um produto.");
    btn.disabled = false;
    btn.innerText = "ENVIAR E SALVAR CUPOM";
    return;
  }

  document.getElementById("cProd").innerText = fd.get("produtor").toUpperCase();
  document.getElementById("cData").innerText = fd.get("data");
  document.getElementById("cHora").innerText = new Date().toLocaleString("pt-BR");

  const cItens = document.getElementById("cItens");
  cItens.innerHTML = "";
  itens.forEach(i=>{
    cItens.innerHTML += `<tr><td>${i.nome}</td><td align="right">${i.qtd}</td></tr>`;
  });

  await fetch("https://script.google.com/macros/s/AKfycbxtbMkL0FlRgxscgqJeItcC5n3t9Hx_5soim2WgILnQJbIE1z-2Kgum6sauDNNNwWhX/exec", {
    method:"POST",
    mode:"no-cors",
    body:new URLSearchParams(fd)
  });

  await new Promise(r=>setTimeout(r,300));

  html2pdf({
    filename:`CLAF_${fd.get("data")}_${fd.get("produtor").replace(/\s+/g,"_")}.pdf`,
    jsPDF:{unit:"mm",format:[80,200],orientation:"portrait"}
  }).from(document.getElementById("cupom")).save();

  btn.disabled = false;
  btn.innerText = "ENVIAR E SALVAR CUPOM";
});
</script>

</body>
</html>
