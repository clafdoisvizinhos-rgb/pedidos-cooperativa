<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cooperativa CLAF - Pedido</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap');
    .fonte-cupom { font-family: 'Courier Prime', monospace; }
  </style>
</head>

<body class="bg-gray-100 min-h-screen font-sans">

<div class="max-w-[420px] mx-auto bg-white min-h-screen shadow">

  <!-- Cabeçalho -->
  <div class="bg-green-700 text-white text-center p-5">
    <h1 class="text-lg font-bold uppercase">Cooperativa</h1>
    <h2 class="text-5xl font-black uppercase text-yellow-400">CLAF</h2>
    <p class="text-xs uppercase mt-1">Sistema de Entrega</p>
  </div>

  <!-- Formulário -->
  <form id="meuFormulario" class="p-4 space-y-4">

    <div>
      <label class="text-sm font-bold uppercase">Produtor</label>
      <input type="text" name="produtor" id="inputNome" required
             class="w-full border p-3 font-bold text-base">
    </div>

    <div>
      <label class="text-sm font-bold uppercase">Data</label>
      <input type="date" name="data" id="campoData" required
             class="w-full border p-3 font-bold text-base">
    </div>

    <table class="w-full fonte-cupom border mt-3">
      <thead>
        <tr class="bg-yellow-300">
          <th class="text-left p-3 text-sm">PRODUTO</th>
          <th class="text-center p-3 text-sm w-28">QTD</th>
        </tr>
      </thead>
      <tbody id="listaProdutos"></tbody>
    </table>

    <button type="submit"
            class="w-full bg-green-600 text-white py-4 font-black uppercase rounded text-lg">
      ENVIAR E SALVAR PDF
    </button>
  </form>
</div>

<!-- CONTEÚDO DO PDF (fora da tela, mas visível ao html2pdf) -->
<div id="conteudoPdfExport"
     class="fonte-cupom"
     style="position:fixed; left:-9999px; top:0; width:76mm; padding:4mm; background:white;">

  <div style="text-align:center; border-bottom:2px dashed black; padding-bottom:8px; margin-bottom:8px;">
    <h2 style="font-size:16px;font-weight:bold;">COOPERATIVA CLAF</h2>
    <p style="font-size:9px;">RECIBO DE PEDIDO</p>
  </div>

  <p style="font-size:11px;"><strong>PRODUTOR:</strong> <span id="pdfNome"></span></p>
  <p style="font-size:11px;"><strong>DATA:</strong> <span id="pdfData"></span></p>

  <table style="width:100%; margin-top:6px;">
    <thead>
      <tr style="border-bottom:1px solid black;">
        <th style="text-align:left;font-size:10px;">PRODUTO</th>
        <th style="text-align:right;font-size:10px;">QTD</th>
      </tr>
    </thead>
    <tbody id="pdfItens"></tbody>
  </table>

  <div style="border-top:2px dashed black; margin-top:8px; padding-top:6px; text-align:center;">
    <p style="font-size:8px;">Emitido em: <span id="pdfTimestamp"></span></p>
    <p style="font-size:10px;font-weight:bold;">Cooperativa CLAF agradece!</p>
  </div>
</div>

<script>
/* ================== PRODUTOS ================== */
const produtos = [
  "Abacate","Abacaxi","Banana caturra","Banana maçã ou prata",
  "Laranja comum","Maçã","Mamão","Manga","Maracujá","Melancia",
  "Melão","Pera","Pêssego","Tangerina comum","Tangerina poncã",
  "Alface","Acelga","Agrião","Almeirão","Couve manteiga",
  "Escarola","Espinafre","Repolho","Rúcula","Abobrinha",
  "Beterraba","Brócolis","Cenoura","Chuchu","Couve-flor",
  "Milho verde","Pepino","Tomate","Vagem","Batata doce",
  "Batata inglesa","Cebola","Cebolinha","Salsinha",
  "Alho poró","Pimentão","Rabanete","Limão"
];

/* ================== DATA AUTOMÁTICA ================== */
const hoje = new Date();
hoje.setMinutes(hoje.getMinutes() - hoje.getTimezoneOffset());
document.getElementById("campoData").value = hoje.toISOString().split("T")[0];

/* ================== LISTA DE PRODUTOS ================== */
const tbody = document.getElementById("listaProdutos");

produtos.forEach(prod => {
  const nameCampo = prod.normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .replace(/\s+/g,"_")
    .toUpperCase();

  const tr = document.createElement("tr");
  tr.innerHTML = `
    <td class="p-3 text-base font-bold">${prod}</td>
    <td class="p-3">
      <input type="number" name="${nameCampo}" min="0"
             class="w-full border text-center text-lg font-bold p-2">
    </td>
  `;
  tbody.appendChild(tr);
});

/* ================== ENVIO ================== */
document.getElementById("meuFormulario").addEventListener("submit", async e => {
  e.preventDefault();

  const form = e.target;
  const params = new URLSearchParams(new FormData(form));

  const produtor = form.produtor.value;
  const data = form.data.value;

  const itens = [];
  for (const [k,v] of params.entries()) {
    if (!["produtor","data"].includes(k) && v && Number(v) > 0) {
      itens.push({ nome: k.replace(/_/g," "), qtd: v });
    }
  }

  if (itens.length === 0) {
    alert("Informe ao menos um produto.");
    return;
  }

  /* ===== ENVIA PARA O APPS SCRIPT ===== */
  await fetch(
    "COLE_AQUI_A_URL_DO_WEB_APP",
    { method:"POST", mode:"no-cors", body: params }
  );

  /* ===== PREPARA PDF ===== */
  document.getElementById("pdfNome").innerText = produtor;
  document.getElementById("pdfData").innerText = data;
  document.getElementById("pdfTimestamp").innerText = new Date().toLocaleString("pt-BR");

  const pdfItens = document.getElementById("pdfItens");
  pdfItens.innerHTML = "";
  itens.forEach(i=>{
    pdfItens.innerHTML += `
      <tr>
        <td style="font-size:10px;">${i.nome}</td>
        <td style="text-align:right;font-size:10px;">${i.qtd}</td>
      </tr>`;
  });

  /* ===== DELAY CRÍTICO PARA PDF ===== */
  await new Promise(r => setTimeout(r, 300));

  await html2pdf()
    .from(document.getElementById("conteudoPdfExport"))
    .save();

  location.reload();
});
</script>

</body>
</html>
