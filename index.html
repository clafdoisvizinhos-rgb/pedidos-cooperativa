<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cooperativa CLAF - Pedidos</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap');
    .fonte-cupom { font-family: 'Courier Prime', monospace; }
    .cabecalho { border-bottom: 2px dashed black; padding-bottom: 8px; margin-bottom: 8px; text-align:center; }
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; }
  </style>
</head>

<body class="bg-gray-100 min-h-screen font-sans">

<div class="max-w-[360px] mx-auto bg-white min-h-screen shadow">

  <!-- Cabeçalho -->
  <div class="bg-green-700 text-white text-center p-4">
    <h1 class="text-lg font-bold uppercase">Cooperativa</h1>
    <h2 class="text-4xl font-black uppercase text-yellow-400">CLAF</h2>
    <p class="text-xs uppercase mt-1">Sistema de Entrega</p>
  </div>

  <!-- Formulário -->
  <form id="meuFormulario" class="p-4 space-y-4">

    <div>
      <label class="text-xs font-bold uppercase">Produtor</label>
      <input type="text" name="produtor" id="inputNome" required
             class="w-full border p-2 font-bold">
    </div>

    <div>
      <label class="text-xs font-bold uppercase">Data</label>
      <input type="date" name="data" id="campoData" required
             class="w-full border p-2 font-bold">
    </div>

    <table class="w-full fonte-cupom border mt-2">
      <thead>
        <tr class="bg-yellow-300">
          <th class="text-left p-2 text-xs">PRODUTO</th>
          <th class="text-center p-2 text-xs">QTD</th>
        </tr>
      </thead>
      <tbody id="listaProdutos"></tbody>
    </table>

    <button type="submit"
            class="w-full bg-green-600 text-white py-3 font-black uppercase rounded">
      ENVIAR E SALVAR PDF
    </button>
  </form>
</div>

<!-- ÁREA DO PDF -->
<div id="conteudoPdfExport" class="fonte-cupom" style="display:none; width:76mm; padding:4mm; background:white;">
  <div class="cabecalho">
    <h2 style="font-size:16px;font-weight:bold;">COOPERATIVA CLAF</h2>
    <p style="font-size:9px;">RECIBO DE PEDIDO</p>
  </div>

  <p style="font-size:11px;"><strong>PRODUTOR:</strong> <span id="pdfNome"></span></p>
  <p style="font-size:11px;"><strong>DATA:</strong> <span id="pdfData"></span></p>

  <table style="width:100%; margin-top:6px;">
    <thead>
      <tr style="border-bottom:1px solid black;">
        <th style="text-align:left;font-size:10px
