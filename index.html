<script>
    // 1. SUBSTITUA A URL ABAIXO PELA SUA URL DE IMPLANTAÇÃO
    const scriptURL = "COLE_AQUI_A_URL_DA_SUA_IMPLANTAÇÃO";

    const tbody = document.getElementById('listaProdutos');
    document.getElementById('campoData').value = new Date().toISOString().split('T')[0];

    // 2. FUNÇÃO PARA CARREGAR PRODUTOS (CORRIGIDA)
    async function carregarProdutos() {
        try {
            const response = await fetch(scriptURL);
            const produtos = await response.json();
            
            tbody.innerHTML = ""; // Limpa mensagem de erro ou carregamento

            produtos.forEach((prod, index) => {
                const tr = document.createElement('tr');
                tr.className = "border-b border-gray-100";
                
                // Normaliza o ID para o envio (remove acentos e espaços)
                const idCol = prod.normalize('NFD').replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, '_');
                
                tr.innerHTML = `
                    <td class="p-2">
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="checkbox" id="check_${index}" class="w-4 h-4 text-green-600">
                            <span class="text-[11px] font-bold uppercase">${prod}</span>
                        </label>
                    </td>
                    <td class="p-1">
                        <input type="number" name="${idCol}" min="0" step="any" class="w-full p-1.5 border rounded text-center font-black" placeholder="0"
                               oninput="document.getElementById('check_${index}').checked = (this.value > 0)">
                    </td>
                `;
                tbody.appendChild(tr);
            });
        } catch (e) {
            console.error(e);
            tbody.innerHTML = "<tr><td colspan='2' class='p-4 text-red-500'>Erro ao carregar lista da planilha.</td></tr>";
        }
    }

    // Chama a função ao abrir a página
    carregarProdutos();

    // 3. ENVIO DOS DADOS (CORRIGIDO)
    document.getElementById('meuFormulario').addEventListener('submit', async function(e) {
        e.preventDefault();
        const btn = document.getElementById('btnEnviar');
        const params = new URLSearchParams();
        const itensParaPDF = [];

        params.append('nome', document.getElementById('inputNome').value);
        params.append('data', document.getElementById('campoData').value);
        params.append('timestamp', new Date().toLocaleString('pt-BR'));

        const inputs = this.querySelectorAll('input[type="number"]');
        inputs.forEach(input => {
            if (input.value && parseFloat(input.value) > 0) {
                params.append(input.name, input.value);
                itensParaPDF.push({ nome: input.name.replace(/_/g, ' '), qtd: input.value });
            }
        });

        if (itensParaPDF.length === 0) return alert("Por favor, informe a quantidade em pelo menos um produto.");

        btn.disabled = true;
        btn.innerHTML = "ENVIANDO...";

        try {
            // Envia para o Apps Script
            await fetch(scriptURL, { method: 'POST', mode: 'no-cors', body: params });
            
            // Gera o PDF
            await gerarPDF(document.getElementById('inputNome').value, document.getElementById('campoData').value, itensParaPDF);
            
            // Mostra sucesso
            document.getElementById('modalSucesso').classList.remove('hidden');
            document.getElementById('modalSucesso').classList.add('flex');
        } catch (err) {
            alert("Erro ao enviar dados para a planilha.");
        } finally {
            btn.disabled = false;
            btn.innerHTML = "ENVIAR E SALVAR PDF ➔";
        }
    });

    // 4. FUNÇÃO PDF (MANTIDA)
    async function gerarPDF(nome, data, itens) {
        const wrapper = document.getElementById('wrapper-pdf');
        document.getElementById('pdfNome').innerText = nome.toUpperCase();
        document.getElementById('pdfData').innerText = data;
        document.getElementById('pdfTimestamp').innerText = new Date().toLocaleString('pt-BR');
        const pdfTbody = document.getElementById('pdfItens');
        pdfTbody.innerHTML = "";
        itens.forEach(i => {
            pdfTbody.innerHTML += `<tr style="border-bottom: 1px solid #eee"><td style="padding: 4px 0; font-size: 10px; font-weight: bold;">${i.nome}</td><td style="text-align: right; font-size: 10px; font-weight: bold;">${i.qtd}</td></tr>`;
        });
        wrapper.style.display = "flex";
        const opt = { margin: 0, filename: 'Pedido_CLAF.pdf', image: { type: 'jpeg', quality: 0.98 }, html2canvas: { scale: 2 }, jsPDF: { unit: 'mm', format: [80, 200] } };
        await html2pdf().set(opt).from(document.getElementById('conteudoPdfExport')).save();
        wrapper.style.display = "none";
    }
</script>
